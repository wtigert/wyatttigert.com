<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s — %s" .Title site.Title }}{{ end }}</title>
<link rel="preload" href="{{ "fonts/archivo-latin-wght-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-display:swap;src:url('{{ "fonts/archivo-latin-wght-normal.woff2" | relURL }}') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('{{ "fonts/ibm-plex-mono-latin-400-normal.woff2" | relURL }}') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('{{ "fonts/ibm-plex-mono-latin-500-normal.woff2" | relURL }}') format('woff2')}
</style>
